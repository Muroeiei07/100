<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王清越 - 亮麗個人網頁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==========================================================================
           1. 變數與全局設定 (Bright & Vibrant Theme)
           ========================================================================== */
        :root {
            --bg-color: #fdfbfb;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --gradient-1: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%);
            --gradient-2: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            --gradient-text: linear-gradient(45deg, #ff0844 0%, #ffb199 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans TC', 'Poppins', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* 亮麗動態背景裝飾 */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--gradient-1); }
        .blob-2 { bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: var(--gradient-2); animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* ==========================================================================
           2. 導覽列
           ========================================================================== */
        .navbar {
            position: fixed;
            top: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 8%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
        }
        .nav-brand { font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 800; background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: color 0.3s; }
        .nav-links a:hover { color: #ff0844; }

        /* ==========================================================================
           3. 主要容器與排版
           ========================================================================== */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 6rem 1.5rem 4rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        /* Hero / 自我介紹 */
        .hero-section {
            text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
            padding: 3rem 0 1rem;
        }
        .avatar {
            width: 150px; height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
            margin-bottom: 1rem;
            transition: transform 0.4s ease;
        }
        .avatar:hover { transform: scale(1.05) rotate(5deg); }
        
        .title { font-size: 3rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem; }
        .subtitle { font-size: 1.2rem; font-weight: 600; color: #ff0844; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .quote {
            font-size: 1.25rem; font-weight: 500; color: var(--text-muted);
            max-width: 600px; margin: 0 auto;
            background: var(--glass-bg); padding: 1.5rem 2rem; border-radius: 20px;
            box-shadow: var(--shadow-soft); border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        /* 興趣與目標 (精簡化 Glassmorphism Card) */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s;
        }
        .glass-card:hover { transform: translateY(-5px); }
        .card-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px;}
        .card-title i { color: #ff0844; }

        .goals-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;
        }
        .goal-item {
            background: rgba(255,255,255,0.8);
            padding: 1.5rem; border-radius: 16px;
            display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .goal-icon { font-size: 2rem; background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .goal-text h4 { font-size: 1.1rem; color: var(--text-main); margin-bottom: 5px; }
        .goal-text p { font-size: 0.95rem; color: var(--text-muted); }

        /* ==========================================================================
           4. 生活隨影 (Gallery)
           ========================================================================== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .gallery-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(255,8,68,0.8) 0%, transparent 100%);
            opacity: 0; transition: opacity 0.4s ease;
            display: flex; align-items: flex-end; padding: 1.5rem;
        }
        .gallery-overlay span {
            color: white; font-weight: 600; font-size: 1.1rem;
            transform: translateY(20px); transition: transform 0.4s ease;
        }
        .gallery-item:hover img { transform: scale(1.1); }
        .gallery-item:hover .gallery-overlay { opacity: 1; }
        .gallery-item:hover .gallery-overlay span { transform: translateY(0); }

        /* ==========================================================================
           5. Footer & Animations
           ========================================================================== */
        footer {
            text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 0.9rem;
        }
        .social-icons { margin-bottom: 1rem; display: flex; justify-content: center; gap: 1rem; }
        .social-icons a { color: var(--text-muted); font-size: 1.2rem; transition: color 0.3s; }
        .social-icons a:hover { color: #ff0844; }

        .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        @media (max-width: 600px) {
            .navbar { padding: 1rem 5%; }
            .nav-links { gap: 1rem; }
            .title { font-size: 2.5rem; }
            .glass-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- 亮麗背景裝飾 -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <nav class="navbar">
        <div class="nav-brand">Qingyue</div>
        <ul class="nav-links">
            <li><a href="#hero">首頁</a></li>
            <li><a href="#about">目標</a></li>
            <li><a href="#gallery">生活照</a></li>
        </ul>
    </nav>

    <main class="container">
        <!-- 精簡自我介紹 -->
        <section id="hero" class="hero-section reveal">
            <!-- 請將大頭貼命名為 profile.jpg 放在同一資料夾 -->
            <img src="profile.jpg" alt="王清越" class="avatar" onerror="this.src='https://via.placeholder.com/150/ffb199/ffffff?text=Q'">
            <h1 class="title">王清越</h1>
            <h2 class="subtitle"><i class="fas fa-palette"></i> 數位多媒體</h2>
            <div class="quote">
                「您好，我是清越。我對寫代碼很感興趣，也期待探索更多可能。」
            </div>
        </section>

        <!-- 精簡目標區塊 -->
        <section id="about" class="glass-card reveal">
            <h2 class="card-title"><i class="fas fa-rocket"></i> 技能與目標</h2>
            <div class="goals-grid">
                <div class="goal-item">
                    <div class="goal-icon"><i class="fas fa-code"></i></div>
                    <div class="goal-text">
                        <h4>程式學習</h4>
                        <p>持續學習編程知識，掌握開發邏輯與技巧。</p>
                    </div>
                </div>
                <div class="goal-item">
                    <div class="goal-icon"><i class="fas fa-gamepad"></i></div>
                    <div class="goal-text">
                        <h4>獨立遊戲開發</h4>
                        <p>我的最終目標是學會寫代碼，然後自己開發一款遊戲。</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 生活隨影區塊 -->
        <section id="gallery" class="glass-card reveal">
            <h2 class="card-title"><i class="fas fa-camera-retro"></i> 生活隨影</h2>
            <p style="color: var(--text-muted); margin-bottom: 1rem;">除了寫代碼，這裡保留了生活中的美好瞬間與靈感來源：</p>
            <div class="gallery-grid">
                <!-- 將 src 替換為您的照片檔名，例如 life1.jpg -->
                <div class="gallery-item">
                    <img src="life1.jpg" alt="生活照 1" onerror="this.src='https://via.placeholder.com/400/ffebee/ff4b2b?text=Photo+1'">
                    <div class="gallery-overlay"><span>日常點滴</span></div>
                </div>
                <div class="gallery-item">
                    <img src="life2.jpg" alt="生活照 2" onerror="this.src='https://via.placeholder.com/400/ffebee/ff4b2b?text=Photo+2'">
                    <div class="gallery-overlay"><span>尋找靈感</span></div>
                </div>
                <div class="gallery-item">
                    <img src="life3.jpg" alt="生活照 3" onerror="this.src='https://via.placeholder.com/400/ffebee/ff4b2b?text=Photo+3'">
                    <div class="gallery-overlay"><span>學習時光</span></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="social-icons">
            <a href="#"><i class="fab fa-github"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fas fa-envelope"></i></a>
        </div>
        <p>© 2024 Wang Qing-Yue. Brilliant & Minimalist Design.</p>
    </footer>

    <!-- 簡單的滑動動畫腳本 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const revealElements = document.querySelectorAll('.reveal');
            const handleScroll = () => {
                const windowHeight = window.innerHeight;
                revealElements.forEach(el => {
                    const elementTop = el.getBoundingClientRect().top;
                    if (elementTop < windowHeight - 50) {
                        el.classList.add('active');
                    }
                });
            };
            window.addEventListener('scroll', handleScroll);
            handleScroll(); // 初始觸發
        });
    </script>
</body>
</html>
